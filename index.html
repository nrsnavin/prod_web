<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F8F8" />
    <title>Jarvis ERP</title>
    <!--
      Apply the saved theme before the first paint. Without this the page
      renders light for a frame and then flips, which reads as a white
      flash on every reload for dark-mode users. Deliberately inline and
      blocking: it must run before the body is painted.
      Reads the same localStorage key the zustand ui store persists under
      (see src/core/ui/uiStore.ts → UI_STORAGE_KEY).
    -->
    <script>
      (function () {
        try {
          var mode = "system";
          var raw = localStorage.getItem("jarvis-ui");
          if (raw) {
            var saved = JSON.parse(raw);
            if (saved && saved.state && saved.state.theme) mode = saved.state.theme;
          }
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#131316");
          }
        } catch (e) {
          /* Corrupt or unavailable storage — fall through to the light theme. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
